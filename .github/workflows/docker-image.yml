name: Docker Image Release

on:
  push:
    tags:
      - 'v*.*.*'   # dispara apenas em versões semânticas

jobs:
  test:
    uses: ./.github/workflows/python-tests.yml

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair versão da tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build da imagem
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/taylor-python:${{ steps.version.outputs.VERSION }} .

      - name: Push versão
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/taylor-python:${{ steps.version.outputs.VERSION }}

      - name: Atualizar latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/taylor-python:${{ steps.version.outputs.VERSION }} ${{ secrets.DOCKER_USERNAME }}/taylor-python:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/taylor-python:latest
